<title>Amt-Lotse – understand letters from German offices</title>

<style>
:root { --blue:#1f5fd1; --blue-dark:#174bb0; --ink:#0f1b33; --muted:#45536e; --surface:#fff; --soft:#f1f5fe;
  --line:#dbe4f5; --green:#0f8a45; --red:#c40000; --shadow:0 1px 2px rgba(15,27,51,.06),0 12px 32px -12px rgba(15,27,51,.18); }
@media (prefers-color-scheme: dark) { :root { --ink:#e8eefc; --muted:#aab6cd; --surface:#131b2c; --soft:#0e1524;
  --line:#2a3650; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6); } }
* { box-sizing:border-box; }
body { margin:0; font:20px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif; color:var(--ink);
  background:var(--soft); }
main { max-width:1080px; margin:auto; padding:20px 20px 40px; }
.top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:1.25em; }
.brand svg { width:44px; height:44px; }
.langs { display:flex; flex-wrap:wrap; gap:8px; }
.langs button { font:inherit; font-size:.8em; padding:6px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); cursor:pointer; }
.langs button[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
.hero { display:grid; grid-template-columns:1.25fr 1fr; gap:24px; align-items:center; margin-top:28px; }
.eyebrow { color:var(--blue); font-weight:700; margin:0; }
h1 { font-size:2.3em; line-height:1.15; margin:.25em 0 .35em; }
.lead { color:var(--muted); margin:0 0 18px; }
.badges { display:flex; flex-wrap:wrap; gap:8px; padding:0; margin:0; list-style:none; }
.badges li { background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 14px; font-size:.8em; }
.art { width:100%; height:auto; }
.status { margin-top:28px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:24px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:20px; flex-wrap:wrap; min-height:110px; }
.status p { margin:0; }
.dot { width:16px; height:16px; border-radius:50%; background:#aab6cd; flex:none; }
.on .dot { background:var(--green); box-shadow:0 0 0 6px rgba(15,138,69,.15); }
.off .dot { background:var(--red); box-shadow:0 0 0 6px rgba(196,0,0,.12); }
.msg { flex:1; min-width:220px; }
.msg strong { display:block; font-size:1.15em; }
.open { display:inline-block; background:var(--blue); color:#fff; text-decoration:none; font-weight:700;
  padding:16px 30px; border-radius:14px; font-size:1.1em; }
.open:hover { background:var(--blue-dark); }
.open[hidden] { display:none; }
footer { margin-top:32px; color:var(--muted); font-size:.8em; }
footer a { color:var(--blue); }
@media (max-width:720px) { .hero { grid-template-columns:1fr; } .art { max-width:300px; margin:auto; display:block; }
  h1 { font-size:1.7em; } .open { width:100%; text-align:center; } }
</style>

<script>
const APP = "https://achraf.tail69df4f.ts.net";
const TEXT = {"en": {"eyebrow": "Your guide through German paperwork", "tagline": "Understand every letter from German offices.", "lead": "Take a photo. Amt-Lotse tells you in your language what the letter wants, by when and how much — and reads it aloud.", "ai_on": "AI ready", "ai_off_h": "The AI server is off", "ai_off": "The computer that runs the AI is switched off right now. Letters can be explained again as soon as it is on. Please try again later.", "open_app": "Open Amt-Lotse", "checking": "Checking whether the AI server is on …", "badges": ["Private AI, no AI company", "8 languages", "Reads aloud", "Ask by voice"]}, "fr": {"eyebrow": "Votre guide dans les courriers administratifs allemands", "tagline": "Comprenez chaque lettre des administrations allemandes.", "lead": "Prenez une photo. Amt-Lotse vous dit dans votre langue ce que la lettre demande, pour quand et combien — et vous la lit à voix haute.", "ai_on": "IA prête", "ai_off_h": "Le serveur d'IA est éteint", "ai_off": "L'ordinateur qui fait tourner l'IA est éteint pour le moment. Les lettres pourront être expliquées dès qu'il sera rallumé. Réessayez plus tard.", "open_app": "Ouvrir Amt-Lotse", "checking": "Vérification : le serveur d'IA est-il allumé ? …", "badges": ["IA privée, sans entreprise d'IA", "8 langues", "Lecture à voix haute", "Questions à la voix"]}, "ar": {"eyebrow": "مرشدك في رسائل الدوائر الألمانية", "tagline": "افهم كل رسالة من الدوائر الألمانية.", "lead": "التقط صورة للرسالة. يخبرك Amt-Lotse بلغتك ماذا تطلب الرسالة، وحتى متى، وكم المبلغ — ويقرؤها لك بصوت عالٍ.", "ai_on": "الذكاء الاصطناعي جاهز", "ai_off_h": "خادم الذكاء الاصطناعي متوقف", "ai_off": "الحاسوب الذي يشغّل الذكاء الاصطناعي مطفأ الآن. يمكن شرح الرسائل مرة أخرى عندما يُشغَّل. يرجى المحاولة لاحقًا.", "open_app": "افتح Amt-Lotse", "checking": "جارٍ التحقق من تشغيل خادم الذكاء الاصطناعي …", "badges": ["ذكاء اصطناعي خاص، بلا شركات", "8 لغات", "يقرأ بصوت عالٍ", "اسأل بصوتك"]}, "tr": {"eyebrow": "Alman resmî yazışmalarında rehberiniz", "tagline": "Alman kurumlarından gelen her mektubu anlayın.", "lead": "Fotoğraf çekin. Amt-Lotse size kendi dilinizde mektubun ne istediğini, son tarihi ve tutarı söyler — ve sesli okur.", "ai_on": "Yapay zekâ hazır", "ai_off_h": "Yapay zekâ sunucusu kapalı", "ai_off": "Yapay zekâyı çalıştıran bilgisayar şu anda kapalı. Açıldığında mektuplar yeniden açıklanabilir. Lütfen daha sonra tekrar deneyin.", "open_app": "Amt-Lotse'yi aç", "checking": "Yapay zekâ sunucusunun açık olup olmadığı kontrol ediliyor …", "badges": ["Özel yapay zekâ, şirket yok", "8 dil", "Sesli okur", "Sesle sorun"]}, "uk": {"eyebrow": "Ваш провідник у німецьких офіційних листах", "tagline": "Розумійте кожен лист від німецьких установ.", "lead": "Сфотографуйте лист. Amt-Lotse пояснить вашою мовою, чого хоче лист, до якого числа і скільки — і прочитає вголос.", "ai_on": "ШІ готовий", "ai_off_h": "Сервер ШІ вимкнено", "ai_off": "Комп’ютер, на якому працює ШІ, зараз вимкнений. Листи знову можна буде пояснити, щойно його увімкнуть. Спробуйте пізніше.", "open_app": "Відкрити Amt-Lotse", "checking": "Перевіряємо, чи увімкнений сервер ШІ …", "badges": ["Приватний ШІ, без ШІ-компаній", "8 мов", "Читає вголос", "Питайте голосом"]}, "ru": {"eyebrow": "Ваш проводник в немецких официальных письмах", "tagline": "Понимайте каждое письмо от немецких ведомств.", "lead": "Сфотографируйте письмо. Amt-Lotse объяснит на вашем языке, чего хочет письмо, до какого числа и сколько — и прочитает вслух.", "ai_on": "ИИ готов", "ai_off_h": "Сервер ИИ выключен", "ai_off": "Компьютер, на котором работает ИИ, сейчас выключен. Письма снова можно будет объяснить, как только его включат. Попробуйте позже.", "open_app": "Открыть Amt-Lotse", "checking": "Проверяем, включён ли сервер ИИ …", "badges": ["Частный ИИ, без ИИ-компаний", "8 языков", "Читает вслух", "Спрашивайте голосом"]}, "fa": {"eyebrow": "راهنمای شما در نامه‌های اداری آلمان", "tagline": "هر نامه از اداره‌های آلمان را بفهمید.", "lead": "از نامه عکس بگیرید. Amt-Lotse به زبان شما می‌گوید نامه چه می‌خواهد، تا کی و چقدر — و آن را بلند می‌خواند.", "ai_on": "هوش مصنوعی آماده است", "ai_off_h": "سرور هوش مصنوعی خاموش است", "ai_off": "رایانه‌ای که هوش مصنوعی روی آن اجرا می‌شود اکنون خاموش است. به‌محض روشن شدن، نامه‌ها دوباره توضیح داده می‌شوند. لطفاً بعداً دوباره امتحان کنید.", "open_app": "باز کردن Amt-Lotse", "checking": "در حال بررسی روشن بودن سرور هوش مصنوعی …", "badges": ["هوش مصنوعی خصوصی، بدون شرکت", "۸ زبان", "بلند می‌خواند", "پرسش با صدا"]}, "de": {"eyebrow": "Ihr Lotse durch Briefe vom Amt", "tagline": "Briefe vom Amt einfach verstehen.", "lead": "Machen Sie ein Foto. Amt-Lotse sagt Ihnen in einfacher Sprache: Was will der Brief? Bis wann? Wie viel? Und liest es vor.", "ai_on": "KI bereit", "ai_off_h": "Der KI-Server ist aus", "ai_off": "Der Computer mit der KI ist gerade ausgeschaltet. Sobald er wieder an ist, können Briefe erklärt werden. Bitte versuchen Sie es später noch einmal.", "open_app": "Amt-Lotse öffnen", "checking": "Prüfe, ob der KI-Server an ist …", "badges": ["Private KI, keine KI-Firma", "8 Sprachen", "Liest vor", "Fragen mit der Stimme"]}};
const RTL = ["ar", "fa"];
let lang = "en", state = "checking";
try { lang = localStorage.getItem("amt-lang") || ""; } catch (e) {}
if (!TEXT[lang]) { const nav = (navigator.language || "en").slice(0, 2); lang = TEXT[nav] ? nav : "en"; }

function render() {
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL.includes(lang) ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t[el.dataset.t]; });
  document.getElementById("badges").innerHTML = "";
  t.badges.forEach(b => { const li = document.createElement("li"); li.textContent = b;
    document.getElementById("badges").appendChild(li); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const box = document.getElementById("status");
  box.className = "status " + state;
  const h = document.getElementById("msg-h"), m = document.getElementById("msg");
  document.getElementById("open").hidden = state !== "on";
  if (state === "on") { h.textContent = t.ai_on; m.textContent = ""; }
  else if (state === "off") { h.textContent = t.ai_off_h; m.textContent = t.ai_off; }
  else { h.textContent = t.checking; m.textContent = ""; }
}

async function check() {
  const stop = new AbortController();
  const timer = setTimeout(() => stop.abort(), 8000);
  try {
    const r = await fetch(APP + "/amt-status", { cache: "no-store", signal: stop.signal });
    const s = await r.json();
    state = s.ai ? "on" : "off";
  } catch (e) { state = "off"; }
  clearTimeout(timer);
  render();
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("amt-lang", lang); } catch (e) {}
  render();
}));
render();
check();
setInterval(check, 30000);
</script>
