[project]
name = "amt-lotse"
version = "0.1.0"
description = "Explains German official letters privately on your own machine: OCR, plain-language explanations, read-aloud and reply drafts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Achref aroua", email = "125191063+achref-2@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "gradio>=6.32.0",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "qrcode>=8.2",
]

[project.scripts]
amt-lotse = "amt_lotse.cli:main"
amt-lotse-ui = "amt_lotse.app:main"
amt-lotse-mcp = "amt_lotse.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]   # long lines are mostly translated sentences
