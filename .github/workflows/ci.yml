# Runs on every push and pull request: lint, the rule tests on Linux and Windows, and a Docker build.
# No models are needed: the tests play the models' answers (including wrong ones) and check the rules around them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Windows too: most users run it there
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0   # no short "v10" tag exists, only full versions
        with:
          enable-cache: true

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest   # also checks that the app itself turns off Gradio's usage statistics

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t amt-lotse:ci .
